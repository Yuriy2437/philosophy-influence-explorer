[project]
name = "philosophy-influence-explorer"
version = "0.1.0"
description = "A multilingual, source-grounded GraphRAG application for exploring philosophical concepts and intellectual influence."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Yuriy" }
]
keywords = ["ai", "fastapi", "graphrag", "langgraph", "neo4j", "philosophy", "rag"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "neo4j>=5.28,<6.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.8,<1.0",
]

[project.urls]
Repository = "https://github.com/Yuriy2437/philosophy-influence-explorer"
Documentation = "https://github.com/Yuriy2437/philosophy-influence-explorer#readme"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/philosophy_influence_explorer"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["philosophy_influence_explorer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.ruff.lint.isort]
known-first-party = ["philosophy_influence_explorer"]
