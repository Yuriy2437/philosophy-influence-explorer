services:
  neo4j:
    image: neo4j:5-community
    container_name: philosophy-influence-neo4j
    restart: unless-stopped

    ports:
      - '7474:7474'
      - '7687:7687'

    environment:
      NEO4J_AUTH: '${NEO4J_USERNAME}/${NEO4J_PASSWORD}'

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - ./infra/neo4j/init:/import/init:ro

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
